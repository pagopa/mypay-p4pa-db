pr: none
trigger: none

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: Env
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - uat
  - name: dbs
    type: object
    default:
      - orchestrator_migration_toolkit

variables:
  ${{ if eq(parameters.Env, 'dev') }}:
    AZURE_SERVICE_CONNECTION: '$(dev_azure_sub_serv_conn)'
    ENV_SHORT: 'd'

  ${{ if eq(parameters.Env, 'uat') }}:
    AZURE_SERVICE_CONNECTION: '$(uat_azure_sub_serv_conn)'
    ENV_SHORT: 'u'

  poolImage: 'p4pa-${{ parameters.Env }}-linux-app'
  KEY_VAULT_NAME: 'p4pa-${{ variables.ENV_SHORT }}-payhub-kv'

stages:
  - stage: initialization_jobs
    displayName: "Init ${{ parameters.Env }}"
    jobs:
      - job: initialization
        pool: $(poolImage)
        displayName: "Applying DB schema migration on ${{ parameters.Env }}"
        steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: "Get secrets"
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              keyVaultName: $(KEY_VAULT_NAME)
              secretsFilter: 'db-migration-toolkit-write-login-username,db-migration-toolkit-write-login-password,db-host'

          - ${{ each db in parameters.dbs }}:
            - task: Bash@3
              displayName: "Set ${{ db }} db configuration"
              inputs:
                targetType: 'inline'
                script: |
                  echo "##vso[task.setvariable variable=DB_USERNAME;issecret=true]$(db-migration-toolkit-write-login-username)"
                  echo "##vso[task.setvariable variable=DB_PASSWORD;issecret=true]$(db-migration-toolkit-write-login-password)"
            - template: templates\db-update.yml
              parameters:
                dbName: ${{ db }}
                dbHost: $(db-host)
                dbPsw: $(DB_PASSWORD)
                dbUsername: $(DB_USERNAME)
